# Runs the whole suite on every push and pull request. There is nothing to
# install: the tool has no dependencies, so this is a checkout, a Node, and the
# two commands the README asks contributors to run by hand.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests
        run: node --test
      - name: dash scan
        run: node tests/dash-scan.mjs
