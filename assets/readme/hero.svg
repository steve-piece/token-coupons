<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">token-coupons</title>
  <desc id="hero-desc">Claude Code puts a listing of every installed skill in the system prompt and re-sends it on every message. The panel on the right shows that listing: four skills the agent has never once chosen, greyed out and still billed, against one it uses. The total reads 10,832 tokens on every message, 7,338 of them buying nothing.</desc>

  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2739" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
    <radialGradient id="wash" cx="20%" cy="10%" r="72%">
      <stop offset="0%" stop-color="#35E3A1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#35E3A1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="392" rx="26" fill="#070A12"/>
  <rect width="1200" height="392" rx="26" fill="url(#g)"/>
  <rect width="1200" height="392" rx="26" fill="url(#wash)"/>
  <rect x="0.5" y="0.5" width="1199" height="391" rx="26" fill="none" stroke="#1E2739"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="500" fill="#7E8CA6" letter-spacing="4">CLAUDE CODE</text>
    <text x="0" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700" fill="#E8EEF9">token-coupons</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="400" fill="#E8EEF9">Every skill you install is described again</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="400" fill="#35E3A1">in every message you send.</text>
    <text x="0" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#7E8CA6">Find the ones the agent has never read, and stop paying for them.</text>
    <rect x="0" y="322" width="446" height="46" rx="11" fill="#131B2C" stroke="#4DD8FF" stroke-opacity="0.45"/>
    <text x="20" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#4DD8FF">npx skills add steve-piece/token-coupons</text>
  </g>

  <g id="the-listing" transform="translate(700 56)">
    <rect x="0" y="0" width="436" height="280" rx="16" fill="#0E1422" stroke="#1E2739"/>
    <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7E8CA6" letter-spacing="2.4">YOUR SKILL LISTING</text>
    <rect x="22" y="48" width="392" height="1" fill="#1E2739"/>

    <g transform="translate(22 68)">
      <rect x="0" y="0" width="392" height="34" rx="7" fill="#131B2C"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#E8EEF9">code-review</text>
      <text x="378" y="23" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#35E3A1">used</text>
    </g>
    <g transform="translate(22 110)">
      <rect x="0" y="0" width="392" height="34" rx="7" fill="#0B111D"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4A5570">pdf-extractor</text>
      <text x="378" y="23" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#FF6B8A">0 uses</text>
    </g>
    <g transform="translate(22 152)">
      <rect x="0" y="0" width="392" height="34" rx="7" fill="#0B111D"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4A5570">jira-sync</text>
      <text x="378" y="23" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#FF6B8A">0 uses</text>
    </g>
    <g transform="translate(22 194)">
      <rect x="0" y="0" width="392" height="34" rx="7" fill="#0B111D"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4A5570">terraform-lint</text>
      <text x="378" y="23" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#FF6B8A">0 uses</text>
    </g>

    <rect x="22" y="240" width="392" height="1" fill="#1E2739"/>
    <text x="22" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7E8CA6">every message</text>
    <text x="414" y="266" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#E8EEF9">10,832 tokens</text>
  </g>
</svg>
